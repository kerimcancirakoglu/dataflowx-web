name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build & Deploy to Cloudflare Workers
        run: pnpm run deploy:cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: "15oto8dp"
          NEXT_PUBLIC_SANITY_DATASET: "production"
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: "0x4AAAAAADq91aSFD3VABRaY"
          NEXT_PUBLIC_WP_URL: "https://dataflowx1.wpenginepowered.com"
          NEXT_PUBLIC_WORDPRESS_API_URL: "https://dataflowx1.wpenginepowered.com/graphql"
