<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark background -->
  <rect width="100" height="100" rx="18" fill="#0a0a0a"/>
  <!-- DFX X mark — gold/amber color matching brand -->
  <!-- Left diagonal line (top-left to bottom-right) -->
  <line x1="20" y1="20" x2="80" y2="80" stroke="#F5A623" stroke-width="14" stroke-linecap="round"/>
  <!-- Right diagonal line (top-right to bottom-left) -->
  <line x1="80" y1="20" x2="20" y2="80" stroke="#F5A623" stroke-width="14" stroke-linecap="round"/>
</svg>
